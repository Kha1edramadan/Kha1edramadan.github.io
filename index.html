<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portfolio — Opening soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,800..900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Display font: put your hero font file next to this page as display.woff2 and it is used automatically.
   Until then the stack falls back to Archivo Expanded Black, the closest match to the ACCIDENT. hero type. */
@font-face{font-family:'Display';src:url('display.woff2') format('woff2');font-display:swap}
:root{--ink:#0a0a0a;--paper:#f2f2ef;--m:clamp(22px,3.4vw,56px);--display:'Display','Archivo',Impact,sans-serif;--ease:cubic-bezier(.7,0,.15,1)}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2ef;--paper:#0a0a0a}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 'Inter',system-ui,sans-serif;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.mute{opacity:.55}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

/* one margin, three anchors: top row, bottom-left title, bottom-right actions */
.top{position:fixed;top:var(--m);left:var(--m);right:var(--m);display:flex;justify-content:space-between;font-weight:500;z-index:2;pointer-events:none}
.hero{position:fixed;left:var(--m);bottom:var(--m);z-index:2;pointer-events:none}
.lead{font-weight:500;font-size:clamp(15px,1.2vw,18px);margin-bottom:clamp(14px,1.8vw,24px);opacity:0;transform:translateY(10px);transition:opacity .8s .6s,transform .8s .6s}
h1{font:900 min(5.4vw,10.5vh)/.98 var(--display);font-variation-settings:'wdth' 125;text-transform:uppercase;letter-spacing:-.02em}
.ln{clip-path:inset(0 -100vw 0 0);padding-top:.05em}
.ln b{display:block;font-weight:inherit;transform:translateY(112%);transition:transform 1s var(--ease)}
.ln:nth-child(2) b{transition-delay:.12s}
.go .ln b{transform:none}.go .lead{opacity:1;transform:none}

.actions{position:fixed;right:var(--m);bottom:var(--m);z-index:3;display:flex;gap:12px;opacity:0;transition:opacity .9s .5s}
.go .actions{opacity:1}
.btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 24px;border:1.5px solid var(--ink);border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap;transition:background .3s,color .3s}
.btn span{display:inline-block;transition:transform .35s var(--ease)}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.fill:hover{background:transparent;color:var(--ink)}
.btn:not(.fill):hover{background:var(--ink);color:var(--paper)}
.btn:hover span{transform:translate(3px,-3px)}

.toast{position:fixed;z-index:5;pointer-events:none;font-weight:600;white-space:nowrap;background:var(--ink);color:var(--paper);padding:6px 14px;animation:tp 1.8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes tp{0%{opacity:0;transform:translate(-50%,10px)}14%{opacity:1;transform:translate(-50%,0)}76%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}

@media (max-width:760px){
  h1{font-size:10vw;font-variation-settings:'wdth' 100}
  .hero{bottom:calc(var(--m) + 78px)}
  .actions{left:var(--m);right:var(--m)}.btn{flex:1;justify-content:center;padding:0 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Two caution tapes. Pull them."></canvas>

<div class="top"><span>Portfolio</span><span class="mute">2026</span></div>

<section class="hero" id="hero">
  <p class="lead">A brand is being built. <span class="mute">Go on, pull the tape.</span></p>
  <h1><div class="ln"><b>Opening</b></div><div class="ln"><b>soon.</b></div></h1>
</section>

<nav class="actions" aria-label="Contact">
  <a class="btn fill" href="mailto:iamkhaledramadan@gmail.com">Email<span>↗</span></a>
  <a class="btn" href="https://wa.me/201010166582" target="_blank" rel="noopener">WhatsApp<span>↗</span></a>
</nav>

<script>
'use strict';
var cv = document.getElementById('cv'), ctx = cv.getContext('2d', {alpha:true}), body = document.body;
var W, H, DPR, mobile, ink = '#0a0a0a', paper = '#f2f2ef';
var still = matchMedia('(prefers-reduced-motion:reduce)').matches;
var MSG = 'UNDER CONSTRUCTION  \u2022  BRAND IN PROGRESS  \u2022  DO NOT CROSS  \u2022  PLEASE DO NOT TOUCH THE KERNING  \u2022  ';
var WARN = ['Hands off.', 'Do not cross.', 'That is a fine.', 'The tape is not free.'];
var tapes = [], grab = null, scroll = 0, warned = 0, mv = {x:0, y:0}, lastP = null;
var N = 56; // Enough vertices for the existing silhouette, without excess per-frame work.
var INTRO_MS = 1550, introStart = -1, introFinished = false;

function colors(){ var cs = getComputedStyle(document.documentElement); ink = cs.getPropertyValue('--ink').trim(); paper = cs.getPropertyValue('--paper').trim(); }
function size(){
  // Prevent very high-density screens from drawing unnecessarily huge bitmaps.
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; mobile = W < 760;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ---- Rope with stable entrance and interactive spring motion ---- */
function Tape(kind, ax, ay, bx, by, sag, h){
  this.kind = kind; this.h = h;
  this.rest = []; this.p = []; this.v = [];
  this.cum = []; this.dirs = []; this.L = 1;
  this.entranceRise = [];
  this.letters = null; this.letterUnit = 0; this.metricsFont = '';
  for (var i = 0; i <= N; i++){
    var t = i / N, x = ax + (bx - ax) * t, y = ay + (by - ay) * t + sag * 4 * t * (1 - t);
    this.rest.push({x:x, y:y});
    this.p.push({x:x, y:y});
    this.v.push({x:0, y:0});
    // Both ends stay anchored. The center enters smoothly instead of giving
    // 70 independent particles a massive initial spring impulse.
    this.entranceRise.push(H * .89 * Math.sin(Math.PI * t));
  }
}
Tape.prototype.enter = function(progress){
  // Smooth ease-out: movement ends at rest with zero velocity (no visible snap).
  var remaining = Math.pow(1 - clamp(progress, 0, 1), 3);
  for (var i = 1; i < N; i++){
    this.p[i].x = this.rest[i].x;
    this.p[i].y = this.rest[i].y - this.entranceRise[i] * remaining;
    this.v[i].x = this.v[i].y = 0;
  }
};
Tape.prototype.step = function(dt, now){
  var p = this.p, v = this.v, r = this.rest, K = 24, T = 620, C = 5.8, i;
  for (i = 1; i < N; i++){
    if (grab && grab.t === this && grab.i === i) continue;
    var lx = p[i-1].x + p[i+1].x - 2*p[i].x, ly = p[i-1].y + p[i+1].y - 2*p[i].y;
    var fl = Math.sin(now * .0016 + i * .21) * 1.4;
    var ax = -K*(p[i].x-r[i].x) + T*lx - C*v[i].x;
    var ay = -K*(p[i].y-r[i].y) + T*ly - C*v[i].y + fl*4;
    v[i].x += ax*dt; v[i].y += ay*dt;
  }
  for (i = 1; i < N; i++){
    if (grab && grab.t === this && grab.i === i) continue;
    p[i].x += v[i].x * dt; p[i].y += v[i].y * dt;
  }
  if (grab && grab.t === this){
    var g=p[grab.i], tx=grab.x, ty=grab.y, rx=r[grab.i].x, ry=r[grab.i].y;
    var dx=tx-rx, dy=ty-ry, d=Math.hypot(dx,dy), maxPull=H*.5;
    if(d>maxPull){tx=rx+dx/d*maxPull;ty=ry+dy/d*maxPull;}
    g.x+=(tx-g.x)*.45; g.y+=(ty-g.y)*.45; v[grab.i].x=v[grab.i].y=0;
    var ddx=g.x-rx, ddy=g.y-ry;
    for(var j=-20;j<=20;j++){
      var q=grab.i+j; if(!j||q<1||q>=N)continue;
      var w=.5*(1+Math.cos(Math.PI*Math.abs(j)/21));
      var qx=r[q].x+ddx*w, qy=r[q].y+ddy*w;
      p[q].x+=(qx-p[q].x)*.4; p[q].y+=(qy-p[q].y)*.4;
      v[q].x*=.6; v[q].y*=.6;
    }
  }
};
Tape.prototype.measure = function(){
  var p=this.p, c=this.cum, d=this.dirs; c[0]=0;
  for(var i=0;i<N;i++){
    var dx=p[i+1].x-p[i].x, dy=p[i+1].y-p[i].y;
    var len=Math.hypot(dx,dy)||1, inv=1/len;
    c[i+1]=c[i]+len;
    // Compute these once per rope segment, not once per character/stripe.
    d[i]={nx:-dy*inv,ny:dx*inv,ang:Math.atan2(dy,dx)};
  }
  this.L=c[N];
};
Tape.prototype.at = function(s){
  s=clamp(s,0,this.L);
  var c=this.cum, p=this.p, lo=0, hi=N;
  while(hi-lo>1){var m=(lo+hi)>>1;if(c[m]<=s)lo=m;else hi=m;}
  var A=p[lo], B=p[lo+1], seg=(c[lo+1]-c[lo])||1;
  var u=(s-c[lo])/seg, d=this.dirs[lo];
  return {x:A.x+(B.x-A.x)*u,y:A.y+(B.y-A.y)*u,nx:d.nx,ny:d.ny,ang:d.ang};
};
Tape.prototype.strip = function(){
  // Previous code sampled the same straight polyline every 8px (hundreds of
  // allocations). Its existing rope nodes are already sufficient geometry.
  var half=this.h/2, Lf=[], Rt=[], p=this.p, d=this.dirs;
  for(var i=0;i<=N;i++){
    var n=d[Math.min(i,N-1)], x=p[i].x, y=p[i].y;
    Lf.push([x+n.nx*half,y+n.ny*half]);
    Rt.push([x-n.nx*half,y-n.ny*half]);
  }
  return {L:Lf,R:Rt};
};
function trace(sp){
  ctx.beginPath();ctx.moveTo(sp.L[0][0],sp.L[0][1]);
  for(var i=1;i<sp.L.length;i++)ctx.lineTo(sp.L[i][0],sp.L[i][1]);
  for(var j=sp.R.length-1;j>=0;j--)ctx.lineTo(sp.R[j][0],sp.R[j][1]);
  ctx.closePath();
}
Tape.prototype.draw = function(){
  this.measure();
  var sp=this.strip(), half=this.h/2;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  trace(sp);ctx.fillStyle=this.kind==='text'?ink:paper;ctx.fill();ctx.restore();
  if(this.kind==='hazard'){
    var w=this.h*.46, sk=this.h*.9, off=(scroll*.3)%(w*2);
    ctx.save();trace(sp);ctx.clip();ctx.fillStyle=ink;
    // One fill for all diagonal marks instead of many individual fills.
    ctx.beginPath();
    for(var s=-w*2-sk+off;s<this.L+sk;s+=w*2){
      var a=this.at(s),b=this.at(s+w),c=this.at(s+w+sk*.5),d=this.at(s+sk*.5);
      if(Math.max(a.x,b.x,c.x,d.x)<-this.h||Math.min(a.x,b.x,c.x,d.x)>W+this.h)continue;
      ctx.moveTo(a.x+a.nx*half,a.y+a.ny*half);
      ctx.lineTo(b.x+b.nx*half,b.y+b.ny*half);
      ctx.lineTo(c.x-c.nx*half,c.y-c.ny*half);
      ctx.lineTo(d.x-d.nx*half,d.y-d.ny*half);
      ctx.closePath();
    }
    ctx.fill();ctx.restore();
    ctx.strokeStyle=ink;ctx.lineWidth=2;
    [sp.L,sp.R].forEach(function(edge){
      ctx.beginPath();ctx.moveTo(edge[0][0],edge[0][1]);
      for(var i=1;i<edge.length;i++)ctx.lineTo(edge[i][0],edge[i][1]);
      ctx.stroke();
    });
  }else{
    var fs=this.h*.3, sp2=fs*.16;
    var font='700 '+fs+'px Inter, system-ui, sans-serif';
    ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=paper;
    if(this.metricsFont!==font||!this.letters){
      this.metricsFont=font;this.letters=[];this.letterUnit=0;
      for(var k=0;k<MSG.length;k++){
        var cw=ctx.measureText(MSG[k]).width+sp2;
        this.letters.push(cw);this.letterUnit+=cw;
      }
    }
    var pos=-(scroll%this.letterUnit),idx=0;
    while(pos<this.L){
      var ci=idx%MSG.length,ch=MSG[ci],cw=this.letters[ci],mid=pos+cw/2;
      if(mid>=0&&mid<=this.L&&ch!==' '){
        var q=this.at(mid);
        if(q.x>-this.h&&q.x<W+this.h&&q.y>-this.h&&q.y<H+this.h){
          // Single transform instead of save/translate/rotate/restore per glyph.
          var co=Math.cos(q.ang),si=Math.sin(q.ang);
          ctx.setTransform(DPR*co,DPR*si,-DPR*si,DPR*co,DPR*q.x,DPR*q.y);
          ctx.fillText(ch,0,0);
        }
      }
      pos+=cw;idx++;
    }
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
};

/* ---- layout: tape crossing stays above the hero text ---- */
function build(){
  var hr=document.getElementById('hero'),top=hr.offsetTop;
  var zt=mobile?86:104, zb=top-56,band=Math.max(150,zb-zt);
  var h=clamp(Math.min(W*.034,band*.26),30,54);
  var sag=band*.14,x0=-W*.04,x1=W*1.04;
  tapes=[
    new Tape('hazard',x0,zt+band*.08,x1,zt+band*.66,sag,h),
    new Tape('text',x0,zt+band*.80,x1,zt+band*.18,sag,h)
  ];
  grab=null;
  if(still||introFinished)tapes.forEach(function(t){t.enter(1);});
  else tapes.forEach(function(t){t.enter(0);});
}

/* ---- interaction ---- */
function nearest(x,y){
  var best=null,bd=1e9;
  for(var ti=tapes.length-1;ti>=0;ti--){
    var t=tapes[ti];
    for(var i=1;i<N;i++){
      var d=Math.hypot(t.p[i].x-x,t.p[i].y-y);
      if(d<bd){bd=d;best={t:t,i:i,d:d};}
    }
  }
  return best&&best.d<best.t.h*.9+6?best:null;
}
cv.addEventListener('pointerdown',function(e){
  if(!introFinished&&!still)return;
  var n=nearest(e.clientX,e.clientY);if(!n)return;
  grab={t:n.t,i:n.i,x:e.clientX,y:e.clientY,told:false};
  cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';
});
cv.addEventListener('pointermove',function(e){
  if(lastP){mv.x=clamp(e.clientX-lastP[0],-24,24);mv.y=clamp(e.clientY-lastP[1],-24,24);}
  lastP=[e.clientX,e.clientY];
  if(grab){
    grab.x=e.clientX;grab.y=e.clientY;
    var r=grab.t.rest[grab.i];
    if(!grab.told&&Math.hypot(e.clientX-r.x,e.clientY-r.y)>120){
      grab.told=true;
      var el=document.createElement('div');el.className='toast';
      el.textContent=WARN[Math.min(warned,WARN.length-1)];warned++;
      el.style.left=clamp(e.clientX,80,W-80)+'px';
      el.style.top=Math.max(70,e.clientY-56)+'px';
      document.body.appendChild(el);
      setTimeout(function(){el.remove();},1900);
    }
    return;
  }
  cv.style.cursor=nearest(e.clientX,e.clientY)?'grab':'default';
  if(introFinished&&!still){
    tapes.forEach(function(t){
      for(var i=1;i<N;i++){
        var d=Math.hypot(t.p[i].x-e.clientX,t.p[i].y-e.clientY);
        if(d<80){var f=1-d/80;t.v[i].y+=mv.y*f*5;t.v[i].x+=mv.x*f*2;}
      }
    });
  }
});
function release(){grab=null;cv.style.cursor='default';}
cv.addEventListener('pointerup',release);
cv.addEventListener('pointercancel',release);

var last=0;
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<tapes.length;i++)tapes[i].draw();
}
function frame(ts){
  if(introStart<0)introStart=ts;
  var dt=Math.min(.033,(ts-last)/1000||0);last=ts;
  if(!still){
    if(!introFinished){
      var progress=(ts-introStart)/INTRO_MS;
      if(progress>=1){introFinished=true;tapes.forEach(function(t){t.enter(1);});}
      else tapes.forEach(function(t){t.enter(progress);});
    }else{
      // Two stable sub-steps after intro (previously three even during intro).
      for(var s=0;s<2;s++)tapes.forEach(function(t){t.step(dt/2,ts);});
    }
    scroll+=dt*40;
  }
  render();
  requestAnimationFrame(frame);
}
var rt=0;
addEventListener('resize',function(){
  clearTimeout(rt);
  rt=setTimeout(function(){size();build();render();},150);
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){colors();});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){
  colors();size();build();
  setTimeout(function(){body.classList.add('go');},still?0:1500);
  requestAnimationFrame(frame);
});
</script>
</body>
