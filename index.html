<!DOCTYPE html>
<html lang="en">

<style>
:root{--ink:#0a0a0a;--paper:#f2f2ef;--m:clamp(22px,3.4vw,56px);--display:'Archivo',Impact,sans-serif;--ease:cubic-bezier(.7,0,.15,1)}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2ef;--paper:#0a0a0a}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 'Inter',system-ui,sans-serif;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
.mute{opacity:.55}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

.top,.foot{position:fixed;left:var(--m);right:var(--m);display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none;font-weight:500}
.top{top:var(--m)}.foot{bottom:var(--m)}
.foot a{pointer-events:auto}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:10px;animation:bl 1.6s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

.hero{position:fixed;left:var(--m);right:var(--m);bottom:calc(var(--m) + 84px);z-index:2;display:flex;flex-direction:column;pointer-events:none}
h1{font:900 min(5.9vw,11.5vh)/.98 var(--display);font-variation-settings:'wdth' 125;text-transform:uppercase;letter-spacing:-.02em}
.ln{clip-path:inset(0 -100vw 0 0);padding-top:.05em}
.ln b{display:block;font-weight:inherit;transform:translateY(112%);transition:transform 1s var(--ease)}
.ln:nth-child(2) b{transition-delay:.12s}
.go .ln b{transform:none}
.lead{align-self:flex-start;margin-bottom:clamp(18px,2.2vw,32px);font-weight:500;font-size:clamp(15px,1.2vw,18px);line-height:1.45;font-weight:400;opacity:0;transform:translateY(10px);transition:opacity .9s .9s,transform .9s .9s}
.lead strong{font-weight:700}
.go .lead{opacity:1;transform:none}
.links{display:flex;gap:clamp(22px,2.6vw,44px)}
.lk{white-space:nowrap;font-weight:600;font-size:clamp(15px,1.25vw,18px);padding-bottom:3px;background:linear-gradient(var(--ink),var(--ink)) left bottom/100% 1px no-repeat;transition:background-size .4s var(--ease)}
.lk span{display:inline-block;margin-left:6px;transition:transform .4s var(--ease)}
.lk:hover{background-size:100% 3px}.lk:hover span{transform:translate(3px,-3px)}
.fadein{opacity:0;transition:opacity .9s 1.2s}.go .fadein{opacity:1}

.toast{position:fixed;z-index:4;pointer-events:none;font-weight:600;white-space:nowrap;background:var(--ink);color:var(--paper);padding:5px 12px;animation:tp 1.9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes tp{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}

@media (max-width:760px){
  .hero{bottom:calc(var(--m) + 70px)}
  h1{font-size:8.6vw;font-variation-settings:'wdth' 100}
  .foot{font-size:13px}.links{gap:16px}.lk{font-size:14px}.foot>span:first-child{white-space:nowrap}
  .lead{margin-bottom:14px}
  .foot{align-items:flex-end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Keep content in normal flow so short viewports and zoom remain usable. */
html,body{height:auto;min-height:100%;overflow-x:clip;overflow-y:auto;overscroll-behavior:auto}
html{color-scheme:light dark}
.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;padding:var(--m);padding-left:max(var(--m),env(safe-area-inset-left));padding-right:max(var(--m),env(safe-area-inset-right));padding-bottom:max(var(--m),env(safe-area-inset-bottom))}
.top,.foot{position:relative;inset:auto;gap:20px;flex-wrap:wrap}
.top{min-height:30px;align-items:center}.top-right{display:flex;align-items:center;gap:20px;pointer-events:auto}
.motion{appearance:none;color:inherit;background:transparent;border:1px solid currentColor;border-radius:999px;padding:5px 11px;font:500 11px/1.5 Inter,system-ui,sans-serif;cursor:pointer}
.motion:hover{background:var(--ink);color:var(--paper)}.motion:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.hero{position:relative;inset:auto;margin-top:auto;padding-top:clamp(190px,36vh,360px);flex-shrink:0}
h1{font-size:clamp(32px,7vw,116px)}
.ln{overflow:visible;clip-path:none}.ln b{transform:none;transition:none}
.lead{opacity:1;transform:none;transition:none;max-width:36em}
.foot{margin-top:clamp(30px,5vh,60px);flex-shrink:0}.fadein{opacity:1;transition:none}
.dot{animation:none;opacity:1}.links{flex-wrap:wrap;row-gap:12px}
canvas{touch-action:pan-y pinch-zoom}.toast{max-width:calc(100vw - 32px);white-space:normal;text-align:center}
@media(max-width:760px){h1{font-size:8.6vw}.top{font-size:13px}.top-right{gap:12px}.hero{padding-top:clamp(180px,34svh,300px)}.foot{align-items:center}.lead{font-size:15px}.links{gap:20px}}
@media(max-width:360px){.top{gap:10px}.top-right{gap:9px}.motion{padding:4px 8px}.foot{gap:18px}.links{gap:18px}}
@media(max-height:500px) and (min-width:761px){.hero{padding-top:170px}h1{font-size:clamp(38px,7vw,88px)}}
@media(prefers-reduced-motion:reduce){.motion{display:none}}
</style>

<body>
<canvas id="cv" aria-hidden="true"></canvas>
<main class="page">

<header class="top"><span>Khaled Ramadan</span><span class="top-right"><button class="motion" id="motion" type="button" aria-pressed="false">Pause motion</button><span class="mute" id="year">2026</span></span></header>

<section class="hero" id="hero">
  <p class="lead">The portfolio is getting its final touches.<br><span class="mute">Branding. Logos. Visual identities.</span></p>

</main>
<div id="announcement" class="sr-only" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<script>
var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), body = document.body;
var W, H, DPR, mobile, ink = '#0a0a0a', paper = '#f2f2ef';
var still = matchMedia('(prefers-reduced-motion:reduce)').matches;
var MSG = 'PORTFOLIO IN PROGRESS  \u2022  GOOD DESIGN TAKES SHAPE  \u2022  BUILT WITH INTENTION  \u2022  MADE TO MAKE A DIFFERENCE  \u2022  ';
var JOKES = ['A little break. Back in a moment.', 'Making room for good work.', 'Work in progress.', 'Good things take shape.'];
var GRAV = .3, breaks = 0, grab = null, tapes = [], textUnit = 0, scroll = 0, mvx = 0, mvy = 0, lastP = null;

function colors(){
  var cs = getComputedStyle(document.documentElement);
  ink = cs.getPropertyValue('--ink').trim(); paper = cs.getPropertyValue('--paper').trim();
}
function size(){
  DPR = Math.min(window.devicePixelRatio || 1, 1.75); W = innerWidth; H = innerHeight; mobile = W < 760;
  cv.width = W * DPR; cv.height = H * DPR;
}

function Tape(kind, ax, ay, bx, by, h, slack){
  var n = 32, chord = Math.hypot(bx - ax, by - ay);
  this.sag = Math.sqrt(Math.max(0, slack - 1) * 3 * chord * chord / 8); this.kind = kind; this.h = h; this.n = n; this.rest = chord * slack / (n - 1); this.ax = ax; this.ay = ay; this.bx = bx; this.by = by; this.broken = -1; this.brokeAt = 0; this.pts = [];
  this.drop();
}
Tape.prototype.drop = function(){
  this.pts = []; this.broken = -1;
  for (var i = 0; i < this.n; i++){
    var t = i / (this.n - 1), x = this.ax + (this.bx - this.ax) * t, y = this.ay + (this.by - this.ay) * t + 4 * this.sag * t * (1 - t);
    this.pts.push({x:x, y:y, px:x, py:y});
  }
  var f = this.pts[0], l = this.pts[this.n - 1]; f.x = f.px = this.ax; f.y = f.py = this.ay; l.x = l.px = this.bx; l.y = l.py = this.by;
};
Tape.prototype.step = function(){
  var p = this.pts, n = this.n, i, k;
  for (var s = 0; s < 1; s++){
    for (i = 1; i < n - 1; i++){
      if (grab && grab.t === this && grab.i === i) continue;
      var q = p[i], vx = (q.x - q.px) * .988, vy = (q.y - q.py) * .988;
      q.px = q.x; q.py = q.y; q.x += vx; q.y += vy + GRAV;
    }
    if (grab && grab.t === this){ var g = p[grab.i]; g.x = g.px = grab.x; g.y = g.py = grab.y; }
    for (k = 0; k < 6; k++){
      for (i = 0; i < n - 1; i++){
        if (i === this.broken) continue;
        var a = p[i], b = p[i + 1], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .0001, df = (d - this.rest) / d;
        var af = (i === 0) || (grab && grab.t === this && grab.i === i), bf = (i + 1 === n - 1) || (grab && grab.t === this && grab.i === i + 1);
        if (af && bf) continue;
        if (af){ b.x -= dx * df; b.y -= dy * df; }
        else if (bf){ a.x += dx * df; a.y += dy * df; }
        else { a.x += dx * df * .5; a.y += dy * df * .5; b.x -= dx * df * .5; b.y -= dy * df * .5; }
      }
    }
  }
  if (this.broken < 0 && grab && grab.t === this){
    var tot = 0, mi = 0, md = 0;
    for (i = 0; i < n - 1; i++){
      var d2 = Math.hypot(p[i + 1].x - p[i].x, p[i + 1].y - p[i].y); tot += d2;
      if (d2 > md){ md = d2; mi = i; }
    }
    if (tot > this.rest * (n - 1) * 1.1) this.snap(grab.i);
  } else if (this.broken >= 0 && performance.now() - this.brokeAt > 2600){ this.drop(); }
};
Tape.prototype.snap = function(i){
  this.broken = i; this.brokeAt = performance.now(); var q = this.pts[i];
  grab = null; cv.style.cursor = 'default';
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = JOKES[Math.min(breaks, JOKES.length - 1)]; breaks++;
  el.style.left = Math.max(110, Math.min(W - 110, q.x)) + 'px'; el.style.top = Math.max(60, q.y - 40) + 'px'; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2000);
  // kick the loose ends
  for (var j = -4; j <= 5; j++){ var r = this.pts[i + (j > 0 ? j : j - 1)]; if (r){ r.x += (j > 0 ? 1 : -1) * 14; r.y -= 10; } }
};

function build(){
  var hr = document.querySelector('.lead').getBoundingClientRect();
  var zt = (mobile ? 92 : 112), zb = Math.min(H * .64, hr.top - 64), zone = Math.max(120, zb - zt), x0 = -W * .05, x1 = W * 1.05, chord = x1 - x0;
  var h = Math.max(28, Math.min(54, zone * .2, W * .034));
  function sl(ay, by){ var c = Math.hypot(x1 - x0, by - ay); return 1 + 8 * (zone * .12) * (zone * .12) / (3 * c * c); }
  var a1 = zt + zone * .42, b1 = zt + zone * .02, a2 = zt + zone * .02, b2 = zt + zone * .42, mid = zt + zone * .22;
  GRAV = .025;
  tapes = [ new Tape('text', x0, a1, x1, b1, h, sl(a1, b1)), new Tape('hazard', x0, a2, x1, b2, h, sl(a2, b2)) ];
  // Start from an analytic resting curve: no blocking warm-up simulation.
  textUnit = 0; textTexture = null;

}
var rebuildT = 0, lastHeroH = 0;
var glyphCache = new Map(), textTexture = null;
function rebuild(){ clearTimeout(rebuildT); rebuildT = setTimeout(function(){ size(); build(); draw(); wake(); }, 120); }

// geometry helpers for a piece of the rope
function piece(t, a, b){
  var P = t.pts, cum = [0], i;
  for (i = a + 1; i <= b; i++) cum.push(cum[cum.length - 1] + Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y));
  return {t:t, a:a, b:b, cum:cum, len:cum[cum.length - 1]};
}
function at(pc, s){
  s = Math.max(0, Math.min(pc.len, s)); var P = pc.t.pts, c = pc.cum, j = 1;
  var lo = 1, hi = c.length - 1;
  while (lo < hi){ var midIndex = (lo + hi) >> 1; if (c[midIndex] < s) lo = midIndex + 1; else hi = midIndex; } j = lo;
  var A = P[pc.a + j - 1], B = P[pc.a + j], seg = (c[j] - c[j - 1]) || 1, u = (s - c[j - 1]) / seg;
  var tx = B.x - A.x, ty = B.y - A.y, l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
  return {x:A.x + (B.x - A.x) * u, y:A.y + (B.y - A.y) * u, nx:-ty, ny:tx, ang:Math.atan2(ty, tx)};
}
function strip(pc){
  var h = pc.t.h / 2, N = Math.max(2, Math.round(pc.len / 12)), L = [], R = [], i;
  for (i = 0; i <= N; i++){ var p = at(pc, pc.len * i / N); L.push([p.x + p.nx * h, p.y + p.ny * h]); R.push([p.x - p.nx * h, p.y - p.ny * h]); }
  return {L:L, R:R};
}
function fillStrip(sp, color){
  ctx.beginPath(); ctx.moveTo(sp.L[0][0], sp.L[0][1]);
  sp.L.forEach(function(q){ ctx.lineTo(q[0], q[1]); });
  for (var i = sp.R.length - 1; i >= 0; i--) ctx.lineTo(sp.R[i][0], sp.R[i][1]);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function drawText(pc){
  var fs = pc.t.h * .3, h = pc.t.h, font = '700 ' + fs + 'px Inter, system-ui, sans-serif';
  var key = fs + ':' + ink + ':' + paper + ':' + DPR;
  if (!textTexture || textTexture.key !== key){
    var texture = document.createElement('canvas'), pen = texture.getContext('2d'), widths = [], unit = 0, spacing = fs * .16;
    pen.font = font;
    for (var i = 0; i < MSG.length; i++){ widths.push(pen.measureText(MSG[i]).width + spacing); unit += widths[i]; }
    texture.width = Math.ceil(unit * DPR); texture.height = Math.ceil(h * DPR);
    pen.setTransform(DPR, 0, 0, DPR, 0, 0); pen.font = font; pen.fillStyle = paper; pen.textBaseline = 'middle';
    var x = 0;
    for (var i = 0; i < MSG.length; i++){ pen.fillText(MSG[i], x, h / 2); x += widths[i]; }
    textTexture = {key:key, image:texture, unit:unit};
  }
  // Warp a cached bitmap along the rope instead of laying out every letter every frame.
  for (var s = 0; s < pc.len;){
    var source = (s + scroll) % textTexture.unit, width = Math.min(24, pc.len - s, textTexture.unit - source);
    if (width < .001){ s += .001; continue; }
    var p = at(pc, s + width / 2);
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang);
    ctx.drawImage(textTexture.image, source * DPR, 0, width * DPR, h * DPR, -width / 2, -h / 2, width + .25, h);
    ctx.restore(); s += width;
  }
}
function drawHazard(pc){
  var h = pc.t.h / 2, w = pc.t.h * .62, sk = pc.t.h * .8, off = -(scroll * .25 % (w * 2)), k;
  fillStrip(strip(pc), paper);
  ctx.fillStyle = ink;
  for (k = -2; k * w < pc.len + w * 2; k += 2){
    var s0 = off + k * w, s1 = s0 + w, a = at(pc, s0), b = at(pc, s1), c = at(pc, s1 + sk * .5), d = at(pc, s0 + sk * .5);
    if (s1 < -sk || s0 > pc.len + sk) continue;
    ctx.beginPath();
    ctx.moveTo(a.x + a.nx * h, a.y + a.ny * h); ctx.lineTo(b.x + b.nx * h, b.y + b.ny * h);
    ctx.lineTo(c.x - c.nx * h, c.y - c.ny * h); ctx.lineTo(d.x - d.nx * h, d.y - d.ny * h); ctx.closePath(); ctx.fill();
  }
  var sp = strip(pc); ctx.strokeStyle = ink; ctx.lineWidth = 2;
  [sp.L, sp.R].forEach(function(e){ ctx.beginPath(); ctx.moveTo(e[0][0], e[0][1]); e.forEach(function(q){ ctx.lineTo(q[0], q[1]); }); ctx.stroke(); });
}
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  tapes.forEach(function(t){
    var pcs = t.broken >= 0 ? [piece(t, 0, t.broken), piece(t, t.broken + 1, t.n - 1)] : [piece(t, 0, t.n - 1)];
    pcs.forEach(function(pc){
      if (pc.len < 4) return;
      if (t.kind === 'text'){ fillStrip(strip(pc), ink); drawText(pc); } else drawHazard(pc);
    });
  });
}

var last = 0, accumulated = 0, raf = 0, paused = false;
function wake(){ if (!raf && !paused && !still && !document.hidden){ last = 0; raf = requestAnimationFrame(frame); } }
function frame(ts){
  raf = 0;
  if (paused || still || document.hidden) return;
  var dt = last ? Math.min(.05, (ts - last) / 1000) : 1 / 60;
  last = ts; scroll += dt * 46; accumulated += dt;
  var count = 0;
  while (accumulated >= 1 / 60 && count < 3){ tapes.forEach(function(t){ t.step(); }); accumulated -= 1 / 60; count++; }
  if (count) draw(); raf = requestAnimationFrame(frame);
}
// input
function nearest(x, y){
  var best = null, bd = 1e9;
  tapes.forEach(function(t){ t.pts.forEach(function(p, i){
    if (i === 0 || i === t.n - 1) return;
    var d = Math.hypot(p.x - x, p.y - y); if (d < bd){ bd = d; best = {t:t, i:i, d:d}; }
  }); });
  return best && best.d < Math.max(36, best.t.h * .9) ? best : null;
}
cv.addEventListener('pointerdown', function(e){
  var n = nearest(e.clientX, e.clientY); if (!n || n.t.broken >= 0) return;
  grab = {t:n.t, i:n.i, x:e.clientX, y:e.clientY}; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; if (paused || still) draw();
});
cv.addEventListener('pointermove', function(e){
  if (lastP){ mvx = e.clientX - lastP[0]; mvy = e.clientY - lastP[1]; } lastP = [e.clientX, e.clientY];
  if (grab){ grab.x = e.clientX; grab.y = e.clientY; if (paused || still){ grab.t.step(); draw(); } return; }
  if (paused || still) return;
  var n = nearest(e.clientX, e.clientY); cv.style.cursor = n ? 'grab' : 'default';
  tapes.forEach(function(t){ t.pts.forEach(function(p, i){
    if (i === 0 || i === t.n - 1) return;
    var d = Math.hypot(p.x - e.clientX, p.y - e.clientY); if (d < 90){ var f = (1 - d / 90) * .22; p.x += mvx * f; p.y += mvy * f * .6; }
  }); });
});
function release(){ grab = null; cv.style.cursor = 'default'; }
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
addEventListener('resize', rebuild);
if (window.ResizeObserver) new ResizeObserver(function(){ var h = document.getElementById('hero').offsetHeight; if (h !== lastHeroH){ lastHeroH = h; rebuild(); } }).observe(document.getElementById('hero'));
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', function(){ colors(); draw(); });

// Start the page without waiting for remote fonts.
document.getElementById('year').textContent = new Date().getFullYear();
colors(); size(); build(); draw(); body.classList.add('go'); wake();
document.getElementById('motion').addEventListener('click', function(){
  paused = !paused; this.setAttribute('aria-pressed', String(paused)); this.textContent = paused ? 'Resume motion' : 'Pause motion';
  if (paused){ cancelAnimationFrame(raf); raf = 0; } else wake();
});
document.addEventListener('visibilitychange', function(){
  if (document.hidden){ cancelAnimationFrame(raf); raf = 0; last = 0; accumulated = 0; } else wake();
});
matchMedia('(prefers-reduced-motion:reduce)').addEventListener('change', function(e){ still = e.matches; if (still){ cancelAnimationFrame(raf); raf = 0; draw(); } else wake(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ rebuild(); });
</script>
