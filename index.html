<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portfolio — Under construction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Display font: put your hero font file next to this page as display.woff2 and it is used automatically.
   Until then the stack falls back to Anton. */
@font-face{font-family:'Display';src:url('display.woff2') format('woff2');font-display:swap}
:root{--ink:#0a0a0a;--paper:#f2f2ef;--m:clamp(22px,3.4vw,56px);--display:'Display','Anton',Impact,sans-serif;--ease:cubic-bezier(.7,0,.15,1)}
@media (prefers-color-scheme:dark){:root{--ink:#f2f2ef;--paper:#0a0a0a}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 'Inter',system-ui,sans-serif;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
.mute{opacity:.55}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

.top,.foot{position:fixed;left:var(--m);right:var(--m);display:flex;justify-content:space-between;align-items:center;z-index:3;pointer-events:none;font-weight:500}
.top{top:var(--m)}.foot{bottom:var(--m)}
.foot a{pointer-events:auto}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-right:10px;animation:bl 1.6s steps(2) infinite}
@keyframes bl{50%{opacity:0}}

.hero{position:fixed;left:var(--m);right:var(--m);bottom:calc(var(--m) + 64px);z-index:2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,24vw);column-gap:clamp(30px,5vw,100px);align-items:end;pointer-events:none}
h1{font:400 clamp(54px,8.8vw,190px)/.94 var(--display);text-transform:uppercase;letter-spacing:.004em}
.ln{clip-path:inset(0 -100vw 0 0);padding-top:.05em}
.ln b{display:block;font-weight:400;transform:translateY(112%);transition:transform 1s var(--ease)}
.ln:nth-child(2) b{transition-delay:.12s}
.go .ln b{transform:none}
.lead{font-size:clamp(15px,1.25vw,19px);line-height:1.45;font-weight:400;padding-bottom:.6em;opacity:0;transform:translateY(10px);transition:opacity .9s .9s,transform .9s .9s}
.lead strong{font-weight:700}
.go .lead{opacity:1;transform:none}
.links{display:flex;gap:clamp(22px,2.6vw,44px)}
.lk{white-space:nowrap;font-weight:600;font-size:clamp(15px,1.25vw,18px);padding-bottom:3px;background:linear-gradient(var(--ink),var(--ink)) left bottom/100% 1px no-repeat;transition:background-size .4s var(--ease)}
.lk span{display:inline-block;margin-left:6px;transition:transform .4s var(--ease)}
.lk:hover{background-size:100% 3px}.lk:hover span{transform:translate(3px,-3px)}
.fadein{opacity:0;transition:opacity .9s 1.2s}.go .fadein{opacity:1}

.toast{position:fixed;z-index:4;pointer-events:none;font-weight:600;white-space:nowrap;background:var(--ink);color:var(--paper);padding:5px 12px;animation:tp 1.9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes tp{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-34px)}}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;row-gap:22px;bottom:calc(var(--m) + 58px)}
  h1{font-size:11.6vw}
  .foot{font-size:13px}.links{gap:16px}.lk{font-size:14px}.foot>span:first-child{white-space:nowrap}
  .lead{max-width:34ch;order:-1;padding-bottom:0}
  .foot{align-items:flex-end}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Two caution tapes you can pull"></canvas>

<div class="top"><span>Portfolio</span><span class="mute">2026</span></div>

<section class="hero" id="hero">
  <h1><div class="ln"><b>Under</b></div><div class="ln"><b>construction.</b></div></h1>
  <p class="lead">A brand is being poured, cured and kerned. Please keep feedback behind the barrier. <strong>Go on, pull the tape.</strong></p>
</section>

<div class="foot">
  <span><i class="dot"></i>Under construction</span>
  <span class="links fadein">
    <a class="lk" href="mailto:iamkhaledramadan@gmail.com">Email<span>↗</span></a>
    <a class="lk" href="https://wa.me/201010166582" target="_blank" rel="noopener">WhatsApp<span>↗</span></a>
  </span>
</div>

<script>
var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), body = document.body;
var W, H, DPR, mobile, ink = '#0a0a0a', paper = '#f2f2ef';
var still = matchMedia('(prefers-reduced-motion:reduce)').matches;
var MSG = 'BRAND IN PROGRESS  \u2022  NO FEEDBACK BEYOND THIS POINT  \u2022  HARD HATS REQUIRED  \u2022  PLEASE DO NOT TOUCH THE KERNING  \u2022  ';
var JOKES = ['Told you.', 'Again? Really?', 'That one is billable.', 'The tape is not free.'];
var breaks = 0, grab = null, tapes = [], textUnit = 0, scroll = 0, mvx = 0, mvy = 0, lastP = null;

function colors(){
  var cs = getComputedStyle(document.documentElement);
  ink = cs.getPropertyValue('--ink').trim(); paper = cs.getPropertyValue('--paper').trim();
}
function size(){
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; mobile = W < 760;
  cv.width = W * DPR; cv.height = H * DPR;
}

function Tape(kind, ax, ay, bx, by, h, slack){
  var n = 60, chord = Math.hypot(bx - ax, by - ay);
  this.kind = kind; this.h = h; this.n = n; this.rest = chord * slack / (n - 1); this.ax = ax; this.ay = ay; this.bx = bx; this.by = by; this.broken = -1; this.brokeAt = 0; this.pts = [];
  this.drop();
}
Tape.prototype.drop = function(){
  this.pts = []; this.broken = -1;
  for (var i = 0; i < this.n; i++){
    var t = i / (this.n - 1), x = this.ax + (this.bx - this.ax) * t, y = -90 - Math.random() * 120 - Math.abs(t - .5) * 40;
    this.pts.push({x:x, y:y, px:x, py:y});
  }
  var f = this.pts[0], l = this.pts[this.n - 1]; f.x = f.px = this.ax; f.y = f.py = this.ay; l.x = l.px = this.bx; l.y = l.py = this.by;
};
Tape.prototype.step = function(){
  var p = this.pts, n = this.n, i, k;
  for (var s = 0; s < 2; s++){
    for (i = 1; i < n - 1; i++){
      if (grab && grab.t === this && grab.i === i) continue;
      var q = p[i], vx = (q.x - q.px) * .992, vy = (q.y - q.py) * .992;
      q.px = q.x; q.py = q.y; q.x += vx; q.y += vy + .3;
    }
    if (grab && grab.t === this){ var g = p[grab.i]; g.x = g.px = grab.x; g.y = g.py = grab.y; }
    for (k = 0; k < 14; k++){
      for (i = 0; i < n - 1; i++){
        if (i === this.broken) continue;
        var a = p[i], b = p[i + 1], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || .0001, df = (d - this.rest) / d;
        var af = (i === 0) || (grab && grab.t === this && grab.i === i), bf = (i + 1 === n - 1) || (grab && grab.t === this && grab.i === i + 1);
        if (af && bf) continue;
        if (af){ b.x -= dx * df; b.y -= dy * df; }
        else if (bf){ a.x += dx * df; a.y += dy * df; }
        else { a.x += dx * df * .5; a.y += dy * df * .5; b.x -= dx * df * .5; b.y -= dy * df * .5; }
      }
    }
  }
  if (this.broken < 0 && grab && grab.t === this){
    var tot = 0, mi = 0, md = 0;
    for (i = 0; i < n - 1; i++){
      var d2 = Math.hypot(p[i + 1].x - p[i].x, p[i + 1].y - p[i].y); tot += d2;
      if (d2 > md){ md = d2; mi = i; }
    }
    if (tot > this.rest * (n - 1) * 1.1) this.snap(grab.i);
  } else if (this.broken >= 0 && performance.now() - this.brokeAt > 2600){ this.drop(); }
};
Tape.prototype.snap = function(i){
  this.broken = i; this.brokeAt = performance.now(); var q = this.pts[i];
  grab = null; cv.style.cursor = 'default';
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = JOKES[Math.min(breaks, JOKES.length - 1)]; breaks++;
  el.style.left = q.x + 'px'; el.style.top = Math.max(60, q.y - 40) + 'px'; document.body.appendChild(el); setTimeout(function(){ el.remove(); }, 2000);
  // kick the loose ends
  for (var j = -4; j <= 5; j++){ var r = this.pts[i + (j > 0 ? j : j - 1)]; if (r){ r.x += (j > 0 ? 1 : -1) * 14; r.y -= 10; } }
};

function build(){
  var h = mobile ? 34 : Math.min(58, Math.max(40, W * .036)), sl = mobile ? 1.03 : 1.016;
  var x0 = -W * .05, x1 = W * 1.05;
  tapes = [
    new Tape('text',  x0, H * (mobile ? .20 : .24), x1, H * (mobile ? .12 : .15), h, sl),
    new Tape('hazard', x0, H * (mobile ? .10 : .12), x1, H * (mobile ? .24 : .27), h, sl)
  ];
}

// geometry helpers for a piece of the rope
function piece(t, a, b){
  var P = t.pts, cum = [0], i;
  for (i = a + 1; i <= b; i++) cum.push(cum[cum.length - 1] + Math.hypot(P[i].x - P[i - 1].x, P[i].y - P[i - 1].y));
  return {t:t, a:a, b:b, cum:cum, len:cum[cum.length - 1]};
}
function at(pc, s){
  s = Math.max(0, Math.min(pc.len, s)); var P = pc.t.pts, c = pc.cum, j = 1;
  while (j < c.length - 1 && c[j] < s) j++;
  var A = P[pc.a + j - 1], B = P[pc.a + j], seg = (c[j] - c[j - 1]) || 1, u = (s - c[j - 1]) / seg;
  var tx = B.x - A.x, ty = B.y - A.y, l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;
  return {x:A.x + (B.x - A.x) * u, y:A.y + (B.y - A.y) * u, nx:-ty, ny:tx, ang:Math.atan2(ty, tx)};
}
function strip(pc){
  var h = pc.t.h / 2, N = Math.max(2, Math.round(pc.len / 12)), L = [], R = [], i;
  for (i = 0; i <= N; i++){ var p = at(pc, pc.len * i / N); L.push([p.x + p.nx * h, p.y + p.ny * h]); R.push([p.x - p.nx * h, p.y - p.ny * h]); }
  return {L:L, R:R};
}
function fillStrip(sp, color){
  ctx.beginPath(); ctx.moveTo(sp.L[0][0], sp.L[0][1]);
  sp.L.forEach(function(q){ ctx.lineTo(q[0], q[1]); });
  for (var i = sp.R.length - 1; i >= 0; i--) ctx.lineTo(sp.R[i][0], sp.R[i][1]);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function drawText(pc){
  var fs = pc.t.h * .3; ctx.font = '700 ' + fs + 'px Inter, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = paper;
  var sp = fs * .16, s = -(scroll % textUnit), idx = 0;
  if (!textUnit){ textUnit = 0; for (var c = 0; c < MSG.length; c++) textUnit += ctx.measureText(MSG[c]).width + sp; }
  while (s < pc.len){
    var ch = MSG[idx % MSG.length], w = ctx.measureText(ch).width + sp, mid = s + w / 2;
    if (mid >= 0 && mid <= pc.len && ch !== ' '){ var p = at(pc, mid); ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.ang); ctx.fillText(ch, 0, 0); ctx.restore(); }
    s += w; idx++;
  }
}
function drawHazard(pc){
  var h = pc.t.h / 2, w = pc.t.h * .62, sk = pc.t.h * .8, off = -(scroll * .25 % (w * 2)), k;
  fillStrip(strip(pc), paper);
  ctx.fillStyle = ink;
  for (k = -2; k * w < pc.len + w * 2; k += 2){
    var s0 = off + k * w, s1 = s0 + w, a = at(pc, s0), b = at(pc, s1), c = at(pc, s1 + sk * .5), d = at(pc, s0 + sk * .5);
    if (s1 < -sk || s0 > pc.len + sk) continue;
    ctx.beginPath();
    ctx.moveTo(a.x + a.nx * h, a.y + a.ny * h); ctx.lineTo(b.x + b.nx * h, b.y + b.ny * h);
    ctx.lineTo(c.x - c.nx * h, c.y - c.ny * h); ctx.lineTo(d.x - d.nx * h, d.y - d.ny * h); ctx.closePath(); ctx.fill();
  }
  var sp = strip(pc); ctx.strokeStyle = ink; ctx.lineWidth = 2;
  [sp.L, sp.R].forEach(function(e){ ctx.beginPath(); ctx.moveTo(e[0][0], e[0][1]); e.forEach(function(q){ ctx.lineTo(q[0], q[1]); }); ctx.stroke(); });
}
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  tapes.forEach(function(t){
    var pcs = t.broken >= 0 ? [piece(t, 0, t.broken), piece(t, t.broken + 1, t.n - 1)] : [piece(t, 0, t.n - 1)];
    pcs.forEach(function(pc){
      if (pc.len < 4) return;
      if (t.kind === 'text'){ fillStrip(strip(pc), ink); drawText(pc); } else drawHazard(pc);
    });
  });
}

var last = 0;
function frame(ts){
  var dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts; scroll += dt * 46;
  tapes.forEach(function(t){ t.step(); }); draw(); requestAnimationFrame(frame);
}

// input
function nearest(x, y){
  var best = null, bd = 1e9;
  tapes.forEach(function(t){ t.pts.forEach(function(p, i){
    if (i === 0 || i === t.n - 1) return;
    var d = Math.hypot(p.x - x, p.y - y); if (d < bd){ bd = d; best = {t:t, i:i, d:d}; }
  }); });
  return best && best.d < Math.max(36, best.t.h * .9) ? best : null;
}
cv.addEventListener('pointerdown', function(e){
  var n = nearest(e.clientX, e.clientY); if (!n || n.t.broken >= 0) return;
  grab = {t:n.t, i:n.i, x:e.clientX, y:e.clientY}; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing';
});
cv.addEventListener('pointermove', function(e){
  if (lastP){ mvx = e.clientX - lastP[0]; mvy = e.clientY - lastP[1]; } lastP = [e.clientX, e.clientY];
  if (grab){ grab.x = e.clientX; grab.y = e.clientY; return; }
  var n = nearest(e.clientX, e.clientY); cv.style.cursor = n ? 'grab' : 'default';
  tapes.forEach(function(t){ t.pts.forEach(function(p, i){
    if (i === 0 || i === t.n - 1) return;
    var d = Math.hypot(p.x - e.clientX, p.y - e.clientY); if (d < 90){ var f = (1 - d / 90) * .22; p.x += mvx * f; p.y += mvy * f * .6; }
  }); });
});
function release(){ grab = null; cv.style.cursor = 'default'; }
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);
addEventListener('resize', function(){ size(); build(); });
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', colors);

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){
  colors(); size(); build();
  if (still){ for (var i = 0; i < 260; i++) tapes.forEach(function(t){ t.step(); }); draw(); body.classList.add('go'); return; }
  setTimeout(function(){ body.classList.add('go'); }, 500);
  requestAnimationFrame(frame);
});
</script>
</body>
